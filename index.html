<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>我的课表</title>
<meta name="theme-color" content="#fffaf0">
<meta name="description" content="金皓天的课程表">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的课表">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <header class="appbar" id="appbar"></header>

  <main class="view" id="view-today"></main>
  <main class="view" id="view-week" hidden></main>
  <main class="view" id="view-settings" hidden></main>

  <nav class="tabbar">
    <button type="button" class="tab is-active" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path>
      </svg>
      <span>今日</span>
    </button>
    <button type="button" class="tab" data-view="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
      <span>课表</span>
    </button>
    <button type="button" class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.7 1.5l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 1z"></path>
      </svg>
      <span>设置</span>
    </button>
  </nav>

  <div class="sheet-mask" id="sheet-mask" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="课程详情" hidden></section>
  <div class="toast" id="toast" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="wall-file" accept="image/*" hidden>
</div>

<script src="app.js"></script>
</body>
</html>
